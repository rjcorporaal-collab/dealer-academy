<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repair Care Trade Counter Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
  /* ---------------------------------------------------------------
     Repair Care brand tokens, taken from repair-care.co.uk:
     green #007F3E, dark green #006933, bright green #00A651,
     signal yellow #FFDC00 with green text, 5px radius,
     Inter 800 for headings and Inter Tight for body copy.
     Every component styles through a token, so the dark theme is a
     token swap only — no component-level theme selectors.
  ---------------------------------------------------------------- */
  :root{
    --green:#007F3E;
    --green-bright:#00A651;
    --yellow:#FFDC00;
    --yellow-tint:#FFF8D1;

    --ground:#F0F0F0;
    --surface:#FFFFFF;
    --surface-alt:#F5F6F5;
    --ink:#333333;
    --ink-strong:#1C1C1C;
    --ink-soft:#5E6B64;
    --ink-faint:#8A928D;
    --line:#DCDCDC;
    --line-strong:#C6CCC8;

    /* green bands: top bar, module header, remember block, table heads */
    --band-bg:#007F3E;
    --band-ink:#FFFFFF;
    --band-rule:rgba(255,255,255,.22);
    --band-chip-bg:rgba(255,255,255,.18);
    --band-chip-ink:#FFFFFF;
    --bar-bg:#006933;
    --tab-ink:rgba(255,255,255,.76);
    --tab-ink-on:#FFFFFF;

    /* dark green panel: the video block */
    --panel-bg:#006933;
    --panel-ink:#FFFFFF;
    --panel-rule:rgba(255,255,255,.2);
    --panel-link:#FFDC00;

    /* green used as text/accent on light surfaces */
    --accent-ink:#007F3E;
    --tint:#E5F2EB;
    --pill-bg:#007F3E;
    --pill-ink:#FFFFFF;

    --good:#007F3E;
    --good-tint:#E5F2EB;
    --bad:#C4321F;
    --bad-tint:#FAE7E3;

    --r:5px;
    --display:"Inter","Helvetica Neue",Arial,sans-serif;
    --body:"Inter Tight","Inter","Segoe UI",system-ui,sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --green:#00A651;
      --green-bright:#2FC172;
      --ground:#0D120F;
      --surface:#161D18;
      --surface-alt:#1B241E;
      --ink:#DCE4DE;
      --ink-strong:#F2F6F3;
      --ink-soft:#A8B3AC;
      --ink-faint:#7E8A83;
      --line:#2A342E;
      --line-strong:#3B4840;

      --band-bg:#123024;
      --band-ink:#F2F6F3;
      --band-rule:#2A342E;
      --band-chip-bg:#0D120F;
      --band-chip-ink:#A8B3AC;
      --bar-bg:#101812;
      --tab-ink:#A8B3AC;
      --tab-ink-on:#F2F6F3;

      --panel-bg:#1B241E;
      --panel-ink:#DCE4DE;
      --panel-rule:#2A342E;
      --panel-link:#2FC172;

      --accent-ink:#2FC172;
      --tint:#152C22;
      --pill-bg:#152C22;
      --pill-ink:#2FC172;

      --good:#2FC172;
      --good-tint:#12291E;
      --bad:#E9755C;
      --bad-tint:#2E1A16;
      --yellow-tint:#2B2712;
    }
  }

  :root[data-theme="dark"]{
    --green:#00A651;
    --green-bright:#2FC172;
    --ground:#0D120F;
    --surface:#161D18;
    --surface-alt:#1B241E;
    --ink:#DCE4DE;
    --ink-strong:#F2F6F3;
    --ink-soft:#A8B3AC;
    --ink-faint:#7E8A83;
    --line:#2A342E;
    --line-strong:#3B4840;

    --band-bg:#123024;
    --band-ink:#F2F6F3;
    --band-rule:#2A342E;
    --band-chip-bg:#0D120F;
    --band-chip-ink:#A8B3AC;
    --bar-bg:#101812;
    --tab-ink:#A8B3AC;
    --tab-ink-on:#F2F6F3;

    --panel-bg:#1B241E;
    --panel-ink:#DCE4DE;
    --panel-rule:#2A342E;
    --panel-link:#2FC172;

    --accent-ink:#2FC172;
    --tint:#152C22;
    --pill-bg:#152C22;
    --pill-ink:#2FC172;

    --good:#2FC172;
    --good-tint:#12291E;
    --bad:#E9755C;
    --bad-tint:#2E1A16;
    --yellow-tint:#2B2712;
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--body);font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--display);font-weight:800;margin:0;line-height:1.15;text-wrap:balance}
  p{margin:0}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--band-bg);color:var(--band-ink)}
  .topbar-inner{max-width:1060px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:inline-flex;align-items:center;gap:7px;background:#fff;border:2px solid #00A651;border-radius:4px;padding:4px 9px 4px 6px}
  .logo-mark{width:15px;height:15px;border-radius:2px;background:#FFDC00;border:2px solid #00A651;flex:0 0 auto}
  .logo-text{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:-0.02em;color:#007F3E;text-transform:uppercase}
  .topbar .sub{font-family:var(--display);font-weight:700;font-size:13.5px;opacity:.9}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .count{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.04em;opacity:.92;font-variant-numeric:tabular-nums}
  .themebtn{
    font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    background:transparent;color:inherit;border:1.5px solid var(--band-rule);
    border-radius:var(--r);padding:5px 11px;cursor:pointer;
  }
  .themebtn:hover{border-color:currentColor}

  /* ---------- module tabs ---------- */
  .tabs{background:var(--bar-bg)}
  .tabs-inner{max-width:1060px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
  .tab{
    flex:0 0 auto;cursor:pointer;border:none;background:transparent;color:var(--tab-ink);
    font-family:var(--display);font-weight:700;font-size:13.5px;
    padding:12px 16px;border-bottom:4px solid transparent;white-space:nowrap;
    display:flex;align-items:center;gap:8px;
  }
  .tab:hover{color:var(--tab-ink-on)}
  .tab[aria-selected="true"]{color:var(--tab-ink-on);border-bottom-color:var(--yellow)}
  .tab .tick{color:var(--yellow);font-size:12px}

  /* ---------- page ---------- */
  .page{max-width:1060px;margin:0 auto;padding-left:20px;padding-right:20px;padding-block:0 60px}

  .modhead{background:var(--band-bg);color:var(--band-ink);border-radius:0 0 var(--r) var(--r);padding:26px 28px 24px;margin-bottom:22px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
  .chip{
    font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    padding:4px 10px;border-radius:var(--r);background:var(--band-chip-bg);color:var(--band-chip-ink);
  }
  .chip.solid{background:var(--yellow);color:#006933}
  .modhead h1{font-size:clamp(24px,3.4vw,34px);letter-spacing:-0.02em}

  /* ---------- phase blocks ---------- */
  .phases{list-style:none;margin:0 0 22px;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .phase-btn{
    width:100%;cursor:pointer;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line-strong);
    border-radius:var(--r);padding:10px 11px 11px;
    font-family:var(--body);color:var(--ink-soft);
    display:flex;flex-direction:column;gap:4px;min-height:76px;
    transition:border-color .15s ease,background .15s ease;
  }
  .phase-btn:hover{border-top-color:var(--green-bright)}
  .phase-btn .pn{
    font-family:var(--display);font-weight:800;font-size:12px;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;
  }
  .phase-btn .pl{font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.25;color:var(--ink-soft)}
  .phase-btn.done{border-top-color:var(--green-bright)}
  .phase-btn.done .pn .dot{color:var(--green-bright)}
  .phase-btn[aria-current="true"]{background:var(--band-bg);border-color:var(--band-bg);border-top-color:var(--yellow)}
  .phase-btn[aria-current="true"] .pn,.phase-btn[aria-current="true"] .pl{color:var(--band-ink)}

  /* ---------- content block ---------- */
  .block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .block-head{background:var(--surface-alt);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .block-head .step{font-family:var(--display);font-weight:800;font-size:12px;color:var(--accent-ink);letter-spacing:.09em;text-transform:uppercase}
  .block-head h2{font-size:19px;color:var(--ink-strong)}
  .block-body{padding:26px 28px 28px;display:flex;flex-direction:column;gap:20px}

  .lede{font-size:19px;line-height:1.55;color:var(--ink-strong)}
  .lede em{color:var(--ink-soft);font-style:italic}

  ol.goals{margin:0;padding:0;list-style:none;counter-reset:g;display:flex;flex-direction:column;gap:11px}
  ol.goals li{counter-increment:g;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;font-size:17px}
  ol.goals li::before{
    content:counter(g);display:grid;place-items:center;width:26px;height:26px;border-radius:var(--r);
    background:var(--pill-bg);color:var(--pill-ink);font-family:var(--display);font-weight:800;font-size:13px;
  }

  /* video */
  .video{background:var(--panel-bg);color:var(--panel-ink);border-radius:var(--r);overflow:hidden}
  .video-top{
    display:flex;gap:16px;align-items:center;padding:20px 22px;flex-wrap:wrap;
    color:inherit;text-decoration:none;
  }
  .video-top:hover .playbtn{transform:scale(1.06)}
  .video-top:hover .vt{text-decoration:underline;text-underline-offset:3px}
  .playbtn{
    flex:0 0 auto;width:54px;height:54px;border-radius:var(--r);border:none;
    background:var(--yellow);color:#006933;display:grid;place-items:center;transition:transform .15s ease;
  }
  .playbtn svg{width:20px;height:20px;margin-left:3px;display:block}
  .video-meta{display:flex;flex-direction:column;min-width:0}
  .video-meta .vt{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.25}
  .video-meta .vd{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.05em;opacity:.82;margin-top:4px;text-transform:uppercase}
  .video-task{padding:15px 22px 19px;border-top:1px solid var(--panel-rule);font-size:16px;line-height:1.5}
  .frame{aspect-ratio:16/9;width:100%;max-width:100%;border:0;display:block;background:#000}
  .video-caption{padding:15px 22px 0;display:flex;flex-direction:column;gap:4px}
  .video-caption .vd a{color:var(--panel-link);text-decoration:underline;text-underline-offset:3px}
  .fallback{padding:12px 22px 16px;font-size:14px}
  .fallback a{color:var(--panel-link);text-decoration:underline;text-underline-offset:3px}

  /* core */
  .core{display:flex;flex-direction:column;gap:22px}
  .core h3{font-size:18px;color:var(--accent-ink);margin-bottom:7px}
  .core p{color:var(--ink);font-size:16.5px}
  .core p strong{color:var(--ink-strong);font-weight:600}

  .benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .benefit{background:var(--tint);border-radius:var(--r);padding:17px 18px;border-top:4px solid var(--green)}
  .benefit .b-h{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px}
  .benefit p{font-size:15.5px;line-height:1.5;color:var(--ink)}

  /* counter */
  .askrow{display:flex;flex-direction:column;gap:10px}
  .ask{
    display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;
    background:var(--surface-alt);border-radius:var(--r);padding:14px 16px;font-size:16px;
    border-left:4px solid var(--green-bright);
  }
  .ask .q{
    display:grid;place-items:center;width:26px;height:26px;border-radius:var(--r);
    background:var(--pill-bg);color:var(--pill-ink);font-family:var(--display);font-weight:800;font-size:14px;
  }
  .ask .a b{color:var(--ink-strong);font-weight:600}

  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:15.5px;min-width:420px}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
  thead th{background:var(--band-bg);color:var(--band-ink);font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;border-bottom:none}
  thead th:first-child{border-radius:var(--r) 0 0 0}
  thead th:last-child{border-radius:0 var(--r) 0 0}
  td:first-child{font-weight:600;color:var(--ink-strong)}
  td .art{font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--accent-ink);display:block;font-variant-numeric:tabular-nums;margin-top:2px}

  .note{background:var(--surface-alt);border-radius:var(--r);padding:15px 17px;font-size:15.5px;line-height:1.55;color:var(--ink)}
  .note strong{color:var(--ink-strong);font-weight:600}
  .saythis{background:var(--yellow-tint);border-left:4px solid var(--yellow);border-radius:0 var(--r) var(--r) 0;padding:16px 19px}
  .saythis .lbl{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink);display:block;margin-bottom:7px}
  .saythis p{font-size:17.5px;font-style:italic;color:var(--ink-strong)}

  /* quiz */
  .quiz{display:flex;flex-direction:column;gap:20px}
  .q-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .q-card .q-t{
    background:var(--surface-alt);padding:14px 17px;
    font-family:var(--display);font-weight:700;font-size:16.5px;line-height:1.35;color:var(--ink-strong);
    display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:start;
  }
  .q-card .q-n{
    display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r);
    background:var(--pill-bg);color:var(--pill-ink);font-size:12px;font-weight:800;
  }
  .opts{display:flex;flex-direction:column;gap:8px;padding:14px 17px}
  .opt{
    display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;text-align:left;width:100%;
    cursor:pointer;font-family:var(--body);font-size:16px;line-height:1.45;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
    transition:border-color .14s ease,background .14s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--green-bright);background:var(--surface-alt)}
  .opt:disabled{cursor:default}
  .opt .k{
    display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r);
    background:var(--surface-alt);color:var(--ink-faint);font-family:var(--display);font-weight:800;font-size:12.5px;
  }
  .opt.picked-good{border-color:var(--good);background:var(--good-tint)}
  .opt.picked-bad{border-color:var(--bad);background:var(--bad-tint)}
  .opt.reveal-good{border-color:var(--good);border-style:dashed}
  .opt.picked-good .k,.opt.reveal-good .k{background:var(--good);color:#fff}
  .opt.picked-bad .k{background:var(--bad);color:#fff}
  .fb{margin:0 17px 16px;font-size:15.5px;line-height:1.5;color:var(--ink);border-left:4px solid var(--line-strong);padding:10px 0 10px 14px}
  .fb.good{border-left-color:var(--good)}
  .fb.bad{border-left-color:var(--bad)}
  .fb b{color:var(--ink-strong);font-weight:600}

  .score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-radius:var(--r);padding:18px 20px;background:var(--surface-alt);border:1px solid var(--line)}
  .score .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
  .score .verdict{font-size:16px;color:var(--ink)}
  .score .verdict b{color:var(--ink-strong);font-weight:600}
  .score.pass{border-color:var(--good);background:var(--good-tint)}
  .score.pass .big{color:var(--good)}
  .score.fail{border-color:var(--bad);background:var(--bad-tint)}
  .score.fail .big{color:var(--bad)}

  /* remember */
  .remember{background:var(--band-bg);color:var(--band-ink);border-radius:var(--r);padding:24px 26px}
  .remember .lbl{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.11em;text-transform:uppercase;opacity:.8;display:block;margin-bottom:9px}
  .remember p{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.35}
  .links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .links li{font-size:16px;display:flex;gap:9px;align-items:baseline}
  .links a{color:var(--accent-ink);text-decoration:none;border-bottom:2px solid var(--tint);font-weight:500}
  .links a:hover{border-bottom-color:var(--yellow)}
  .links .dur{font-family:var(--display);font-weight:600;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

  .verify{
    display:inline-block;font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.05em;
    background:var(--yellow);color:#006933;border-radius:3px;padding:2px 7px;vertical-align:middle;
  }

  /* ---------- figures (inline SVG, no external assets) ---------- */
  .fig{margin:0;background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px}
  .fig svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}
  .fig figcaption{font-size:14px;line-height:1.45;color:var(--ink-soft);margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .fig figcaption b{color:var(--ink-strong);font-weight:600}
  .fig text{font-family:var(--display);font-weight:700}

  .sv-wood{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
  .sv-grain{stroke:var(--line-strong);stroke-width:1;opacity:.55}
  .sv-rot{fill:var(--bad);opacity:.5}
  .sv-prime{stroke:var(--green-bright);stroke-width:3;fill:none;stroke-linecap:round}
  .sv-fill{fill:var(--accent-ink);opacity:.35}
  .sv-paint{stroke:var(--accent-ink);stroke-width:2.5;fill:none;stroke-linecap:round}
  .sv-lbl{font-size:11px;fill:var(--ink-soft)}
  .sv-num{font-size:10px;fill:var(--band-ink)}
  .sv-numbg{fill:var(--band-bg)}
  .sv-crack{stroke:var(--bad);stroke-width:2;fill:none;stroke-linecap:round}
  .sv-track{stroke:var(--line-strong);stroke-width:3;stroke-linecap:round}
  .sv-done{stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round}
  .sv-dot{fill:var(--accent-ink)}
  .sv-dot-open{fill:var(--surface);stroke:var(--accent-ink);stroke-width:2.5}
  .sv-drop{fill:var(--green-bright)}

  @keyframes figIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .fig-stage{animation:figIn .45s ease backwards}
  .fig-stage:nth-of-type(2){animation-delay:.35s}
  .fig-stage:nth-of-type(3){animation-delay:.7s}
  .fig-stage:nth-of-type(4){animation-delay:1.05s}

  @keyframes woodShift{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
  @keyframes patchStretch{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.13)}}
  @keyframes crackPulse{0%,100%{opacity:.35}50%{opacity:1}}
  .an-shift{animation:woodShift 4.5s ease-in-out infinite}
  .an-stretch{animation:patchStretch 4.5s ease-in-out infinite;transform-origin:left center}
  .an-crack{animation:crackPulse 4.5s ease-in-out infinite}

  @keyframes soak{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}
  .an-soak{animation:soak 3s ease-in infinite}
  .an-soak:nth-of-type(2){animation-delay:1s}
  .an-soak:nth-of-type(3){animation-delay:2s}

  @keyframes runAlong{0%{stroke-dashoffset:var(--len)}100%{stroke-dashoffset:0}}
  .an-run{stroke-dasharray:var(--len);animation:runAlong 1.4s ease-out .2s backwards}

  /* step strip */
  .stepstrip{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch}
  .stepchip{
    flex:1 1 118px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:10px 11px;display:flex;flex-direction:column;gap:5px;
  }
  .stepchip .sn{
    width:21px;height:21px;border-radius:4px;display:grid;place-items:center;

  /* icons */

</style>

<header class="topbar">
  <div class="topbar-inner">
    <span class="logo"><span class="logo-mark"></span><span class="logo-text">Repair Care</span></span>
    <span class="sub" id="sub"></span>
    <span class="right">
      <span class="count" id="count"></span>
      <button class="themebtn" id="themebtn" type="button"></button>
    </span>
  </div>
</header>
<nav class="tabs"><div class="tabs-inner" id="tabs" role="tablist"></div></nav>

<div class="page">
  <div id="modhead"></div>
  <ol class="phases" id="phases"></ol>
  <section class="block" id="block"></section>
  <div class="phasenav" id="phasenav"></div>
</div>
<script>
let state = { view: "intro", current: 0, phase: 0, results: {}, seen: {} };
let KEY = "rc-academy";

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s = localStorage.getItem(KEY); if (s) state = Object.assign(state, JSON.parse(s)); }catch(e){} }

const esc = s => String(s).replace(/&(?![a-z#][a-z0-9]*;)/gi,"&amp;").replace(/</g,"&lt;");
const passed = id => { const r = state.results[id]; return r && r.score >= 3; };

function phasesOf(){
  return [
    { key:"hook",    label:L.ph.hook },
    { key:"goals",   label:L.ph.goals },
    { key:"video",   label:L.ph.video },
    { key:"core",    label:L.ph.core },
    { key:"counter", label:L.ph.counter },
    { key:"quiz",    label:L.ph.quiz },
    { key:"close",   label:L.ph.close }
  ];
}

function seenKey(m, i){ return m.id + ":" + i; }
function scrollTop(){ window.scrollTo({ top: 0, behavior: "smooth" }); }

function goIntro(){ state.view = "intro"; save(); render(); scrollTop(); }
function goModule(i, phase){ state.view = "module"; state.current = i; state.phase = phase || 0; save(); render(); scrollTop(); }

function renderChrome(){
  document.getElementById("sub").textContent = L.sub;
  document.getElementById("themebtn").textContent = L.theme;
  const done = MODULES.filter(m => passed(m.id)).length;
  document.getElementById("count").textContent = done + " / " + MODULES.length + " " + L.completed;

  const tabs = document.getElementById("tabs");
  let html = '<button class="tab" role="tab" type="button" data-intro="1" aria-selected="' +
    (state.view === "intro") + '">' + INTRO.tab + '</button>';
  html += MODULES.map((m, i) =>
    '<button class="tab" role="tab" type="button" data-i="' + i + '" aria-selected="' +
      (state.view === "module" && i === state.current) + '">' +
      m.n + ' &middot; ' + m.railTitle + (passed(m.id) ? ' <span class="tick">&#10003;</span>' : '') +
    '</button>').join('');
  tabs.innerHTML = html;
  tabs.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.intro) goIntro(); else goModule(+b.dataset.i, 0);
  }));
}

/* ---------------------------------------------------------------
   Inline SVG icons and figures. Everything is drawn with paths and
   theme tokens, so the page carries no image files and stays small.
---------------------------------------------------------------- */
const ICONS = {
  coins:    '<circle cx="9" cy="9" r="5"/><path d="M14.5 6.2a5 5 0 0 1 0 11.6M6 20h9"/>',
  clock:    '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.3l3.3 2"/>',
  shield:   '<path d="M12 3.2 19 6v6c0 4-3 7-7 8.8C8 19 5 16 5 12V6Z"/><path d="M9 12l2.2 2.2L15.4 10"/>',
  receipt:  '<path d="M6 3.5h12v17l-2.4-1.6-2.4 1.6-2.4-1.6-2.4 1.6L6 20.5Z"/><path d="M9.2 8.5h5.6M9.2 12.5h5.6"/>',
  chat:     '<path d="M20 12.8c0 3.6-3.6 6.5-8 6.5a9.6 9.6 0 0 1-2.6-.35L4.5 20.5l1.1-3.1A6.2 6.2 0 0 1 4 12.8c0-3.6 3.6-6.5 8-6.5s8 2.9 8 6.5Z"/><path d="M12 10v.2M12 12.6v.2"/>',
  person:   '<circle cx="12" cy="8.2" r="3.6"/><path d="M5.4 20c.6-3.5 3.4-5.5 6.6-5.5s6 2 6.6 5.5"/>',
  wrench:   '<path d="M15.6 4.8a4.6 4.6 0 0 0-5.9 5.9L4 16.4l3.1 3.1 5.7-5.7a4.6 4.6 0 0 0 5.9-5.9l-2.7 2.7-2.3-2.3Z"/>',
  layers:   '<path d="M12 3.6 3.8 8 12 12.4 20.2 8Z"/><path d="M3.8 12.6 12 17l8.2-4.4M3.8 16.6 12 21l8.2-4.4"/>',
  cert:     '<path d="M7 3.6h10v11.8l-5 2.6-5-2.6Z"/><path d="M9.6 9.2 11.5 11l3.2-3.4"/><path d="M9 18.4v2.6l3-1.4 3 1.4v-2.6"/>',
  alert:    '<path d="M12 4.5 21 19.5H3Z"/><path d="M12 10.2v3.6M12 16.4v.2"/>',
  spark:    '<path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.4 10.1 12.8 4.5 10.9 10.1 9Z"/>',
  grid:     '<path d="M4.5 4.5h6v6h-6ZM13.5 4.5h6v6h-6ZM4.5 13.5h6v6h-6ZM13.5 13.5h6v6h-6Z"/>'
};
function ico(name){
  return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.spark) + '</svg>';
}

function figWrap(svg, cap){
  return '<figure class="fig">' + svg + (cap ? '<figcaption>' + cap + '</figcaption>' : '') + '</figure>';
}

/* Cross-section of a repair, built up in four stages. */
function figCross(f){
  const W = 118, G = 12;
  const stage = (i, label) => {
    const x = i * (W + G);
    const notch = 'M' + (x + 6) + ' 30 h' + (W - 12) + ' v20 h-30 v14 h-24 v-14 h-32 Z';
    let inner = '';
    if (i === 0){
      inner = '<rect x="' + (x + 6) + '" y="30" width="' + (W - 12) + '" height="34" rx="2" class="sv-wood"/>' +
              '<path d="M' + (x + 44) + ' 34 q10 -3 20 2 q9 5 16 0 v26 h-36 Z" class="sv-rot"/>';
    } else if (i === 1){
      inner = '<path d="' + notch + '" class="sv-wood"/>';
    } else if (i === 2){
      inner = '<path d="' + notch + '" class="sv-wood"/>' +
              '<path d="M' + (x + 82) + ' 50 h-24 v14 h-24" class="sv-prime"/>';
    } else {
      inner = '<rect x="' + (x + 6) + '" y="30" width="' + (W - 12) + '" height="34" rx="2" class="sv-wood"/>' +
              '<path d="M' + (x + 82) + ' 50 h-24 v14 h-24 v-14 Z" class="sv-fill"/>' +
              '<path d="M' + (x + 10) + ' 27 h' + (W - 20) + '" class="sv-paint"/>';
    }
    const grain = '<path d="M' + (x + 12) + ' 38 h' + (W - 24) + 'M' + (x + 12) + ' 45 h30" class="sv-grain"/>';
    return '<g class="fig-stage">' + inner + grain +
      '<rect x="' + (x + 6) + '" y="76" width="16" height="16" rx="4" class="sv-numbg"/>' +
      '<text x="' + (x + 14) + '" y="87" text-anchor="middle" class="sv-num">' + (i + 1) + '</text>' +
      '<text x="' + (x + 28) + '" y="87" class="sv-lbl">' + label + '</text></g>';
  };
  const svg = '<svg viewBox="0 0 ' + (4 * W + 3 * G) + ' 96" role="img" aria-label="' + esc(f.alt) + '">' +
    f.labels.map((l, i) => stage(i, l)).join('') + '</svg>';
  return figWrap(svg, f.cap);
}

/* Rigid filler cracks, elastic repair moves with the timber. */
function figFlex(f){
  const panel = (x, title, note, elastic) => {
    const block = '<rect x="' + (x + 4) + '" y="26" width="96" height="36" rx="2" class="sv-wood"/>';
    const moving = '<g class="an-shift"><rect x="' + (x + 112) + '" y="26" width="96" height="36" rx="2" class="sv-wood"/>' +
      '<path d="M' + (x + 120) + ' 34 h80M' + (x + 120) + ' 54 h52" class="sv-grain"/></g>';
    const patch = elastic
      ? '<g class="an-stretch"><rect x="' + (x + 100) + '" y="26" width="12" height="36" class="sv-fill"/></g>'
      : '<rect x="' + (x + 100) + '" y="26" width="12" height="36" class="sv-fill"/>' +
        '<path d="M' + (x + 112) + ' 26 l4 9 l-4 9 l4 9 l-4 9" class="sv-crack an-crack"/>';
    return '<g>' + block +
      '<path d="M' + (x + 12) + ' 34 h80M' + (x + 12) + ' 54 h52" class="sv-grain"/>' +
      moving + patch +
      '<text x="' + (x + 4) + '" y="16" class="sv-lbl">' + title + '</text>' +
      '<text x="' + (x + 4) + '" y="78" class="sv-lbl">' + note + '</text></g>';
  };
  const svg = '<svg viewBox="0 0 470 84" role="img" aria-label="' + esc(f.alt) + '">' +
    panel(0, f.left, f.leftNote, false) +
    '<path d="M235 20 v52" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 4"/>' +
    panel(250, f.right, f.rightNote, true) + '</svg>';
  return figWrap(svg, f.cap);
}

/* Working time versus curing time on one track. */
function figTime(f){
  const X0 = 14, X1 = 452, len = X1 - X0;
  const marks = f.marks.map((m, i) => {
    const x = X0 + m.x * len;
    const anchor = i === 0 ? 'start' : (i === f.marks.length - 1 ? 'end' : 'middle');
    return '<g><circle cx="' + x + '" cy="34" r="' + (m.open ? 5.5 : 6) + '" class="' + (m.open ? 'sv-dot-open' : 'sv-dot') + '"/>' +
      '<text x="' + x + '" y="22" text-anchor="' + anchor + '" class="sv-lbl">' + m.t + '</text>' +
      '<text x="' + x + '" y="54" text-anchor="' + anchor + '" class="sv-lbl" opacity=".8">' + m.l + '</text></g>';
  }).join('');
  const svg = '<svg viewBox="0 0 470 64" role="img" aria-label="' + esc(f.alt) + '">' +
    '<path d="M' + X0 + ' 34 H' + X1 + '" class="sv-track"/>' +
    '<path d="M' + X0 + ' 34 H' + X1 + '" class="sv-done an-run" style="--len:' + len + '"/>' +
    marks + '</svg>';
  return figWrap(svg, f.cap);
}

/* The working sequence, with the most-skipped step called out. */
function figSteps(f){
  const chips = f.items.map((s, i) =>
    '<div class="stepchip' + (i === f.hi ? ' hi' : '') + '"><span class="sn">' + (i + 1) + '</span>' +
    '<span class="sl">' + s + '</span></div>').join('');
  return '<figure class="fig"><div class="stepstrip">' + chips + '</div>' +
    (f.cap ? '<figcaption>' + f.cap + '</figcaption>' : '') + '</figure>';
}

/* Primer soaking into the timber. */
function figSoak(f){
  const drops = [90, 200, 310].map(x =>
    '<g class="an-soak"><ellipse cx="' + x + '" cy="30" rx="5" ry="7" class="sv-drop"/></g>').join('');
  const fibres = [];
  for (let i = 0; i < 14; i++){
    const x = 40 + i * 28;
    fibres.push('<path d="M' + x + ' 44 v30" class="sv-grain"/>');
  }
  const svg = '<svg viewBox="0 0 470 92" role="img" aria-label="' + esc(f.alt) + '">' +
    '<text x="4" y="16" class="sv-lbl">' + f.top + '</text>' +
    drops +
    '<rect x="14" y="42" width="442" height="34" rx="2" class="sv-wood"/>' +
    fibres.join('') +
    '<rect x="14" y="42" width="442" height="12" class="sv-fill"/>' +
    '<text x="466" y="88" text-anchor="end" class="sv-lbl">' + f.bottom + '</text></svg>';
  return figWrap(svg, f.cap);
}

/* The training levels as a rising staircase. */
function figLadder(f){
  const n = f.items.length, w = 470 / n, base = 132;
  const steps = f.items.map((it, i) => {
    const h = 34 + i * 26, x = i * w, y = base - h;
    return '<g class="fig-stage"><rect x="' + (x + 3) + '" y="' + y + '" width="' + (w - 6) + '" height="' + h + '" rx="3" ' +
      'fill="var(--tint)" stroke="var(--accent-ink)" stroke-width="1.5"/>' +
      '<text x="' + (x + 12) + '" y="' + (y + 19) + '" class="sv-lbl" style="fill:var(--accent-ink)">' + it.n + '</text>' +
      '<text x="' + (x + 12) + '" y="' + (y + 34) + '" class="sv-lbl">' + it.l + '</text></g>';
  }).join('');
  const svg = '<svg viewBox="0 0 470 140" role="img" aria-label="' + esc(f.alt) + '">' + steps +
    '<path d="M0 ' + base + ' H470" stroke="var(--line-strong)" stroke-width="1.5"/></svg>';
  return figWrap(svg, f.cap);
}

/* One-series horizontal bar chart: where a product sits in the range.
   Every bar is labelled directly, so there is no axis and no legend;
   the highlighted bar carries the yellow signal marker. */
function figBars(f){
  const rowH = 32, pad = 8, labelW = 158, x0 = labelW, x1 = 406;
  const max = Math.max.apply(null, f.items.map(i => i.v));
  const rows = f.items.map((it, i) => {
    const y = pad + i * rowH;
    const w = Math.max(4, (it.v / max) * (x1 - x0));
    const on = i === f.hi;
    const strong = on ? ' style="fill:var(--ink-strong)"' : '';
    return '<g><title>' + it.l + ': ' + it.t + '</title>' +
      '<text x="' + (labelW - 12) + '" y="' + (y + 19) + '" text-anchor="end" class="sv-lbl"' + strong + '>' + it.l + '</text>' +
      '<rect x="' + x0 + '" y="' + (y + 7) + '" width="' + w.toFixed(1) + '" height="17" rx="4" ' +
        (on ? 'fill="var(--accent-ink)"' : 'fill="var(--tint)" stroke="var(--accent-ink)" stroke-width="1.5"') + '/>' +
      (on ? '<rect x="' + x0 + '" y="' + (y + 7) + '" width="5" height="17" rx="2.5" fill="var(--yellow)"/>' : '') +
      '<text x="' + (x0 + w + 9).toFixed(1) + '" y="' + (y + 19) + '" class="sv-lbl"' + strong + '>' + it.t + '</text></g>';
  }).join('');
  const h = pad * 2 + f.items.length * rowH;
  return figWrap('<svg viewBox="0 0 470 ' + h + '" role="img" aria-label="' + esc(f.alt) + '">' +
    rows + '<path d="M' + x0 + ' ' + pad + ' V' + (h - pad) + '" stroke="var(--line-strong)" stroke-width="1"/></svg>', f.cap);
}

const FIGS = { cross:figCross, flex:figFlex, time:figTime, steps:figSteps, soak:figSoak, ladder:figLadder, bars:figBars };

function figuresFor(m, key){
  if (!m.fig || !m.fig[key]) return '';
  return m.fig[key].map(f => (FIGS[f.t] ? FIGS[f.t](f) : '')).join('');
}

/* The Claude artifact sandbox refuses third-party iframes, so an embed there
   renders an empty grey box. Anywhere else — a local file, your own server, an
   LMS — the embed works. The page detects which it is and renders accordingly. */
const CAN_EMBED = !/(^|\.)claudeusercontent\.com$/i.test(location.hostname);

function videoBlock(v){
  const watch = 'https://www.youtube.com/watch?v=' + v.id;

  if (!CAN_EMBED){
    return '<div class="video">' +
      '<a class="video-top" href="' + watch + '" target="_blank" rel="noopener">' +
        '<span class="playbtn" aria-hidden="true">' +
          '<svg viewBox="0 0 18 18"><path d="M2 1.5 16 9 2 16.5Z" fill="currentColor"/></svg>' +
        '</span>' +
        '<span class="video-meta"><span class="vt">' + v.title + '</span>' +
        '<span class="vd">' + L.channel + ' &middot; ' + v.dur + ' &middot; ' + L.openYT + '</span></span>' +
      '</a>' +
      '<div class="video-task"><b>' + L.watchTask + '</b> ' + v.task + '</div>' +
    '</div>';
  }

  return '<div class="video">' +
    '<iframe class="frame" src="https://www.youtube-nocookie.com/embed/' + v.id + '?rel=0" ' +
      'title="' + esc(v.title) + '" loading="lazy" ' +
      'allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>' +
    '<div class="video-caption"><span class="vt">' + v.title + '</span>' +
    '<span class="vd">' + L.channel + ' &middot; ' + v.dur + ' &middot; ' +
      '<a href="' + watch + '" target="_blank" rel="noopener">' + L.openYT + '</a></span></div>' +
    '<div class="video-task"><b>' + L.watchTask + '</b> ' + v.task + '</div>' +
  '</div>';
}

function phaseBody(m, key){
  if (key === "hook") return '<p class="lede">' + m.hook + '</p>' + figuresFor(m, "hook");

  if (key === "goals") return '<ol class="goals">' + m.goals.map(g => '<li><span>' + g + '</span></li>').join('') + '</ol>';

  if (key === "video") return videoBlock(m.video);

  if (key === "core"){
    let h = '<div class="core">' + m.core.map(k => '<div><h3>' + k.h + '</h3><p>' + k.p + '</p></div>').join('') + '</div>';
    h += figuresFor(m, "core");
    if (m.levels){
      h += '<div class="tablewrap"><table><thead><tr>' + m.levelHead.map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>' +
        m.levels.map(r => '<tr>' + r.map((c, i) => '<td' + (i === 0 ? ' style="white-space:normal"' : '') + '>' + c + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>';
    }
    h += '<div><h3 style="font-family:var(--display);font-size:18px;color:var(--accent-ink);margin-bottom:12px">' + L.benefitsTitle + '</h3><div class="benefits">' +
      m.benefits.map(b => '<div class="benefit"><div class="b-h">' + ico(b.icon) + b.h + '</div><p>' + b.p + '</p></div>').join('') +
      '</div></div>';
    return h;
  }

  if (key === "counter"){
    let h = '';
    if (m.asks){
      h += '<div class="askrow">' + m.asks.map(a =>
        '<div class="ask"><span class="q">?</span><span class="a"><b>&ldquo;' + a.q + '&rdquo;</b><br>' + a.a + '</span></div>').join('') + '</div>';

    '<span></span><button class="btn next" type="button" id="start">' + INTRO.start + '</button>';
  document.getElementById("start").addEventListener("click", () => goModule(0, 0));
}

function renderModule(){
  const m = MODULES[state.current];
  const ps = phasesOf();
  if (state.phase >= ps.length) state.phase = 0;
  const cur = ps[state.phase];
  answered = {};

  document.getElementById("modhead").innerHTML =
    '<div class="modhead"><div class="chips">' +
      '<span class="chip solid">' + m.type + '</span>' +
      '<span class="chip">' + L.module + ' ' + m.n + '</span>' +
      '<span class="chip">' + m.duur + '</span>' +
    '</div><h1>' + m.title + '</h1></div>';

  const phasesEl = document.getElementById("phases");
  phasesEl.hidden = false;
  phasesEl.innerHTML = ps.map((p, i) => {
    const done = state.seen[seenKey(m, i)] && i !== state.phase;
    return '<li><button class="phase-btn' + (done ? ' done' : '') + '" type="button" data-p="' + i + '"' +
      ' aria-current="' + (i === state.phase) + '">' +
      '<span class="pn">' + String(i + 1).padStart(2, "0") + (done ? ' <span class="dot">&#10003;</span>' : '') + '</span>' +
      '<span class="pl">' + p.label + '</span></button></li>';
  }).join('');
  phasesEl.querySelectorAll(".phase-btn").forEach(b =>
    b.addEventListener("click", () => { state.phase = +b.dataset.p; save(); render(); }));

  document.getElementById("block").innerHTML =
    '<div class="block-head"><span class="step">' + L.step + ' ' + (state.phase + 1) + '/' + ps.length + '</span>' +
    '<h2>' + cur.label + '</h2></div>' +
    '<div class="block-body">' + phaseBody(m, cur.key) + '</div>';

  state.seen[seenKey(m, state.phase)] = true;
  save();

  renderNav(m, ps);
  wire(m, cur.key);
}

function renderNav(m, ps){
  const last = state.phase === ps.length - 1;
  const lastModule = state.current === MODULES.length - 1;
  const nextLabel = last ? (lastModule ? L.finish : L.nextModule) : L.nextPhase;
  document.getElementById("phasenav").innerHTML =
    '<button class="btn ghost" type="button" id="prev">' + L.back + '</button>' +
    '<button class="btn next" type="button" id="next"' + (last && lastModule ? ' disabled' : '') + '>' + nextLabel + '</button>' +
    '<span class="navhint" id="hint"></span>';

  document.getElementById("prev").addEventListener("click", () => {
    if (state.phase > 0){ state.phase--; save(); render(); scrollTop(); }
    else if (state.current > 0) goModule(state.current - 1, phasesOf().length - 1);
    else goIntro();
  });
  const nextBtn = document.getElementById("next");
  nextBtn.addEventListener("click", () => {
    if (state.phase < ps.length - 1){ state.phase++; save(); render(); scrollTop(); }
    else if (state.current < MODULES.length - 1) goModule(state.current + 1, 0);
  });

  if (ps[state.phase].key === "quiz" && !passed(m.id)){
    nextBtn.disabled = true;
    document.getElementById("hint").textContent = L.quizHint;
  }
}

function wire(m, key){
  if (key !== "quiz") return;

  document.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      if (answered[qi] !== undefined) return;
      answered[qi] = oi;
      const q = m.quiz[qi];
      const card = document.querySelector('.q-card[data-q="' + qi + '"]');
      const right = oi === q.correct;
      card.querySelectorAll(".opt").forEach(o => {
        o.disabled = true;
        const k = +o.dataset.o;
        if (k === oi) o.classList.add(right ? "picked-good" : "picked-bad");
        else if (k === q.correct && !right) o.classList.add("reveal-good");
      });
      card.querySelector(".fb-slot").innerHTML =
        '<div class="fb ' + (right ? "good" : "bad") + '"><b>' + (right ? L.correct : L.wrong) + '</b> ' + q.opts[oi][1] +
        (right ? '' : '<br><b>' + L.rightIs + ' ' + "ABC"[q.correct] + ':</b> ' + q.opts[q.correct][1]) + '</div>';
      if (Object.keys(answered).length === m.quiz.length) showScore(m);
    });
  });
}

function showScore(m){
  let score = 0;
  m.quiz.forEach((q, i) => { if (answered[i] === q.correct) score++; });
  state.results[m.id] = { score };
  save();
  const pass = score >= 3;
  document.getElementById("score-slot").innerHTML =
    '<div class="score ' + (pass ? "pass" : "fail") + '" style="margin-top:20px">' +
      '<span class="big">' + score + '/' + m.quiz.length + '</span>' +
      '<span class="verdict">' + (pass ? L.passText : L.failText) + '</span>' +
      '<button class="btn ghost" type="button" id="retry" style="margin-left:auto;font-size:14px;padding:9px 18px">' + L.retry + '</button>' +
    '</div>';
  document.getElementById("retry").addEventListener("click", () => render());
  renderChrome();
  renderNav(m, phasesOf());
}

document.getElementById("themebtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});
